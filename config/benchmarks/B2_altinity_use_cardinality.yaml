# config/benchmarks/B2_altinity_use_cardinality.yaml
benchmark_id: B2_altinity_use_cardinality
name: "Altinity — ClickHouse vs Redshift NYC Taxi Benchmark"
url: "https://altinity.com/blog/clickhouse-and-redshift-face-off-again-in-nyc-taxi-rides-benchmark"
published: "2020"

dataset:
  entity: trips
  rows: 1_300_000_000
  years: "2009-2015"
  taxi_types: [yellow, green]
  date_from: "2009-01-01"
  date_to:   "2015-12-31"

software:
  name: ClickHouse
  version: "20.6.6.44"

hardware:
  cores_used: 32
  source_from_blog: "We start with the latest ClickHouse version 20.6.6.44 running inside Kubernetes on an Amazon m5.8large EC2 instance."
  actual: "AWS m5.8xlarge — 32 vCPUs, 128 GB RAM"
  cloud_equivalent: "m5.8xlarge"
  region: "us-east-1"
  note: "$1.54/hr = ~$1,109/month on-demand"

# Zone note:
# 2009-2010 data has lat/long not zone IDs — conv_pickup_zone skipped for those years.
# Matches Altinity LEFT JOIN behaviour where pre-2017 rows return null zone.

queries:
  - id: Q1
    category: raw_data_aggregate
    enabled: true
    sql: >
      SELECT passenger_count, AVG(total_amount)
      FROM trips
      GROUP BY passenger_count
    cac_sql: >
      SELECT passenger_count,
             AVG(total_amount) AS avg_total_amount
      FROM facts
      GROUP BY passenger_count
    nature: "Grouped aggregate — average fare per passenger count"
    cac_phase: "Phase 2 (facts direct)"
    benchmark_time_ms: 620
    validation:
      compare: exact

  - id: Q2
    category: distinct_counting
    enabled: true
    sql: >
      SELECT passenger_count,
             DATE_PART('year', pickup_datetime) AS year,
             COUNT(*)
      FROM trips
      GROUP BY passenger_count, DATE_PART('year', pickup_datetime)
      ORDER BY passenger_count, DATE_PART('year', pickup_datetime)
    cac_sql: >
      SELECT passenger_count,
             LEFT(pickup_date, 4) as year,
             SUM(cardinality) AS cnt
      FROM conv_pax_distance_date
      GROUP BY passenger_count, LEFT(pickup_date, 4)
      ORDER BY passenger_count, year
    nature: "Two-dimensional count — passenger count × year"
    cac_phase: "Phase 1"
    benchmark_time_ms: 1110
    validation:
      compare: exact

  - id: Q3
    category: distinct_counting
    enabled: true
    sql: >
      SELECT passenger_count,
             DATE_PART('year', pickup_datetime) AS year,
             ROUND(trip_distance) AS distance,
             COUNT(*)
      FROM trips
      GROUP BY passenger_count, DATE_PART('year', pickup_datetime), ROUND(trip_distance)
      ORDER BY passenger_count, DATE_PART('year', pickup_datetime), ROUND(trip_distance)
    cac_sql: >
      SELECT passenger_count,
             LEFT(pickup_date, 4) as year,
             trip_distance AS distance,
             SUM(cardinality) AS cnt
      FROM conv_pax_distance_date
      GROUP BY passenger_count, LEFT(pickup_date, 4), trip_distance
      ORDER BY passenger_count, year, trip_distance
    nature: "Three-dimensional count with ranking"
    cac_phase: "Phase 1"
    benchmark_time_ms: 1780
    validation:
      compare: exact

  - id: Q4
    category: distinct_counting
    enabled: true
    sql: >
      SELECT tz.zone AS zone, COUNT(*) AS c
      FROM trips AS td
      LEFT JOIN taxi_zones AS tz ON td.PULocationID = tz.location_id
      GROUP BY tz.zone
      ORDER BY c DESC
    cac_sql: >
      SELECT tz.zone AS zone,
             SUM(c.cardinality) AS cnt
      FROM conv_pickup_zone AS c
      LEFT JOIN taxi_zones AS tz ON c.PULocationID = tz.location_id
      GROUP BY tz.zone
      ORDER BY cnt DESC
    nature: "Top pickup zones by trip count (JOIN to taxi_zones, group by name)"
    cac_phase: "Phase 1 + zone join"
    benchmark_time_ms: 940
    zone_note: "2009-2010 zone-less trips (NULL PULocationID) are kept and land in the NULL-zone bucket via LEFT JOIN, matching Altinity Q4 exactly (plain LEFT JOIN, GROUP BY zone, no filter)."
    validation:
      compare: exact

  - id: Q5
    category: distinct_counting
    enabled: true
    sql: >
      SELECT COUNT(*) AS c
      FROM trips AS td
      WHERE td.PULocationID IN (
        SELECT location_id FROM taxi_zones WHERE zone = 'Midtown East'
      )
    cac_sql: >
      SELECT SUM(c.cardinality) AS cnt
      FROM conv_pickup_zone AS c
      WHERE c.PULocationID IN (
          SELECT location_id FROM taxi_zones WHERE zone = 'Midtown East'
        )
    nature: "Count trips from Midtown East (IN subquery on taxi_zones)"
    cac_phase: "Phase 1 + zone subquery"
    benchmark_time_ms: 330
    zone_note: "2009-2010 excluded. Matches Altinity Q5 rewrite: PULocationID IN (SELECT location_id FROM taxi_zones WHERE zone = 'Midtown East')."
    validation:
      compare: exact
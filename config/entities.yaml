# config/entities.yaml
# Defines entities, their ID strategies, and fact columns.
#
# Pipeline flow:
#   download    → data/raw/entities/<name>/
#   extract_id  → data/extracted/entities/<name>/
#   clean       → data/clean/entities/<name>/  +  data/dirty/entities/<name>/
#   enrich      → data/enriched/entities/<name>/  +  data/facts/entities/<name>/
#   convolute   → data/convolutions/entities/<name>/yyyy/mm/

entities:

  - name: trips

    # columns to derive and add before unique_id generation
    # these become available in the unique_id format template
    add_cols:
      - col: cab_type
        strategy: from_filename
        patterns:
          yellow: "yellow"
          green:  "green"
          fhv:    "fhv|hvfhv"

      - col: year
        strategy: from_filename_regex
        regex: '(\d{4})-\d{2}'
        group: 1

      - col: month
        strategy: from_filename_regex
        regex: '\d{4}-(\d{2})'
        group: 1

    # unique string ID for this entity
    # used as natural key in Postgres
    unique_id:
      col: trip_id
      strategy: derived
      format: "{year}_{month}_{rownum:08d}_{cab_type}"

    # integer entity_id via Postgres BIGSERIAL (required for roaring bitmaps)
    entity_id:
      id_table: cac.trip_ids    # Postgres table: trip_id TEXT PK, entity_id BIGSERIAL

    # primary timeseries column — used to partition fact table output
    primary_timestamp:
      col: pickup_datetime
      output_col: pickup_date
      transform: extract_date   # TIMESTAMP → DATE
      partitions: [year]
      #partitions: [year, month, day]
      # output: data/facts/entities/trips/yyyy/mm/dd/<filename>.parquet

    # numeric columns to keep as slim fact table for Phase 2 aggregations
    # schema: entity_id + pickup_date + fact_cols
    fact_cols:
      - col: pickup_datetime
        dtype: TIMESTAMP
      - col: fare_amount
        dtype: float64
      - col: total_amount
        dtype: float64
      - col: tip_amount
        dtype: float64
      - col: tolls_amount
        dtype: float64
      - col: trip_distance
        dtype: float64
      - col: passenger_count
        dtype: Int64

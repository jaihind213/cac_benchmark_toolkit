# config/convolutions_year.yaml
# Defines bitmap convolutions per entity.
#
# All convolutions partitioned by [year]
# Output: data/convolutions/entities/<entity>/yyyy/<name>.parquet
#
# Supported transforms:
#   none         — use column value as-is
#   round        — standard rounding: 1.59 → 2
#   extract_date — TIMESTAMP → DATE
#   extract_hour — TIMESTAMP → 0-23
#   extract_year — TIMESTAMP → year integer
#
# Output flags (optional, default false):
#   add_cardinality_col — adds cardinality BIGINT = len(bitmap), precomputed.
#                         Lets queries use SUM(cardinality) instead of
#                         SUM(rb_count(bitmap)) — native, no UDF per row.
#   add_hash_col        — adds bitmap_hash BIGINT = stable blake2b hash of the
#                         bitmap bytes, usable as a cross-process cache key.

convolutions:

  - entity: trips
    name: conv_cab_type
    dim_cols:
      - col: pickup_datetime
        transform: extract_date
        output_col: pickup_date
      - col: cab_type
        transform: none
    output:
      bitmap_col: entity_id
      add_cardinality_col: true
      add_hash_col: true
      partitions:
        - col: pickup_date
          parts: [year]
    # schema: pickup_date DATE, cab_type STRING, bitmap BLOB, cardinality BIGINT, bitmap_hash BIGINT

  - entity: trips
    name: conv_pax_distance_date
    dim_cols:
      - col: pickup_datetime
        transform: extract_date
        output_col: pickup_date
      - col: passenger_count
        transform: none
      - col: trip_distance
        transform: round
    output:
      bitmap_col: entity_id
      add_cardinality_col: true
      add_hash_col: true
      partitions:
        - col: pickup_date
          parts: [year]
    # schema: pickup_date DATE, passenger_count INT, trip_distance INT, bitmap BLOB, cardinality BIGINT, bitmap_hash BIGINT
    # replaces: conv_passenger_count, conv_pax_year, conv_pax_year_distance
    # answers Q2 (pax count), Q3 (pax × year), Q4 (pax × year × distance)

  - entity: trips
    name: conv_hour_pickup
    dim_cols:
      - col: pickup_datetime
        transform: extract_date
        output_col: pickup_date
      - col: pickup_datetime
        transform: extract_hour
        output_col: pickup_hour
    output:
      bitmap_col: entity_id
      add_cardinality_col: true
      add_hash_col: true
      partitions:
        - col: pickup_date
          parts: [year]
    # schema: pickup_date DATE, pickup_hour INT, bitmap BLOB, cardinality BIGINT, bitmap_hash BIGINT

  - entity: trips
    name: conv_pickup_zone
    dim_cols:
      - col: pickup_datetime
        transform: extract_date
        output_col: pickup_date
      - col: PULocationID
        transform: none
    output:
      bitmap_col: entity_id
      add_cardinality_col: true
      add_hash_col: true
      keep_null_dims: true      # keep NULL PULocationID (2009-2010) so Q4 LEFT JOIN yields a NULL-zone bucket matching Altinity
      partitions:
        - col: pickup_date
          parts: [year]
    # schema: pickup_date DATE, PULocationID INT, bitmap BLOB, cardinality BIGINT, bitmap_hash BIGINT

  - entity: trips
    name: conv_dropoff_zone
    dim_cols:
      - col: pickup_datetime
        transform: extract_date
        output_col: pickup_date
      - col: pickup_datetime
        transform: extract_hour
        output_col: pickup_hour
      - col: DOLocationID
        transform: none
    output:
      bitmap_col: entity_id
      add_cardinality_col: true
      add_hash_col: true
      partitions:
        - col: pickup_date
          parts: [year]
    # schema: pickup_date DATE, pickup_hour INT, DOLocationID INT, bitmap BLOB, cardinality BIGINT, bitmap_hash BIGINT

  - entity: trips
    name: conv_payment_type
    dim_cols:
      - col: pickup_datetime
        transform: extract_date
        output_col: pickup_date
      - col: payment_type
        transform: none
    output:
      bitmap_col: entity_id
      add_cardinality_col: true
      add_hash_col: true
      partitions:
        - col: pickup_date
          parts: [year]
    # schema: pickup_date DATE, payment_type INT, bitmap BLOB, cardinality BIGINT, bitmap_hash BIGINT

  - entity: trips
    name: conv_rate_code
    dim_cols:
      - col: pickup_datetime
        transform: extract_date
        output_col: pickup_date
      - col: RatecodeID
        transform: none
    output:
      bitmap_col: entity_id
      add_cardinality_col: true
      add_hash_col: true
      partitions:
        - col: pickup_date
          parts: [year]
    # schema: pickup_date DATE, RatecodeID INT, bitmap BLOB, cardinality BIGINT, bitmap_hash BIGINT